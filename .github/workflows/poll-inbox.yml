# Hourly: send new store newsletters from info@dailygreendeals.com to the site for deal extraction.
# Repository secrets needed: IMAP_USER, IMAP_PASS, INGEST_TOKEN. Variable (optional): INGEST_URL.
name: Poll inbox

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      since_days:
        description: 'How many days back to look (default 30)'
        required: false
        default: '30'

concurrency:
  group: poll-inbox
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=optional
      - run: node scripts/poll-inbox.mjs
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          INGEST_URL: ${{ vars.INGEST_URL || 'https://new.dailygreendeals.com/api/ingest/' }}
          NON_STORE_ADDRESSES: info@dailygreendeals.com,kimberly@dailygreendeals.com
          SINCE_DAYS: ${{ inputs.since_days || '30' }}
          TIME_BUDGET_MINUTES: '12'
